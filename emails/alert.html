<!doctype html>
<html>
  <body style="margin:0;padding:0;background:#f7f6f3;font-family:Arial,Helvetica,sans-serif;color:#1d1b19;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f7f6f3;padding:24px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;background:#ffffff;border-radius:10px;overflow:hidden;border:1px solid #e5e1d8;">
            <tr>
              <td style="background:#d7261e;border-bottom:4px solid #ffc61a;padding:16px 20px;">
                <img src="{{logo}}" width="40" height="40" alt="" style="border-radius:50%;vertical-align:middle;background:#ffc61a;">
                <span style="color:#ffffff;font-size:18px;font-weight:bold;vertical-align:middle;margin-left:10px;">AHG53 Agency</span>
              </td>
            </tr>
            <tr>
              <td style="padding:20px;">
                <h2 style="margin:0 0 8px;color:#d7261e;font-size:20px;">{{type}}</h2>
                <p style="margin:0 0 16px;font-weight:bold;">{{customer}}</p>
                <p style="margin:0 0 20px;line-height:1.5;">{{details}}</p>
                <a href="{{link}}" style="display:inline-block;background:#d7261e;color:#ffffff;text-decoration:none;padding:10px 18px;border-radius:8px;font-weight:bold;">Open in dashboard</a>
              </td>
            </tr>
            <tr>
              <td style="padding:12px 20px;background:#fff4cc;font-size:12px;color:#6b665f;">
                Ideas to Digital Reality · +91 8866475352 · ahg53.bond
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
